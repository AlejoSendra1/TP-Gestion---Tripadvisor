services:
  db:
    image: "postgres:17.4"
    restart: "on-failure:3"
    environment:
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - "db_data:/var/lib/postgresql/data"
    ports:
      - "127.0.0.1:${DB_EXTERNAL_PORT}:5432"

  backend:
    build: "./backend"
    depends_on:
      - "db"
    restart: "on-failure:3"
    environment:
      # Configuración de DB
      SPRING_DATASOURCE_USERNAME: "${DB_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/${DB_NAME}"

      # --- INYECCIÓN DE VARIABLES DEL SCRIPT ---
      TRIPPY_FRONTEND_URL: "${TRIPPY_FRONTEND_URL}"
      TRIPPY_API_BASE_URL: "${TRIPPY_API_BASE_URL}"
    ports:
      - "${BACKEND_EXTERNAL_PORT}:8080"
    volumes:
      - ./backend/uploads:/home/app/uploads

  frontend:
    build: "./frontend"
    depends_on:
      - "backend"
    restart: "on-failure:3"
    environment:
      # URL pública del Backend (browser -> backend)
      # Usamos la misma variable calculada: puede ser localhost:30002 o ngrok
      VITE_API_BASE_URL: "${TRIPPY_API_BASE_URL}"
    ports:
      - "${FRONTEND_EXTERNAL_PORT}:80"

  adminer:
    image: "adminer:5.0.4"
    depends_on:
      - "db"
    restart: "on-failure:3"
    ports:
      - "${ADMINER_EXTERNAL_PORT}:8080"

volumes:
  db_data: